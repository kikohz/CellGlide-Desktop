[package]
name = "cg-netstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# FakeSocks and PacketDriver, for this crate's flow tests and the hev comparison (Task 10).
testkit = ["dep:etherparse"]

[dependencies]
cg-protocol.workspace = true
etherparse = { workspace = true, optional = true }
smoltcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
# The flow tests use the testkit; enabling it here keeps them in `cargo test --workspace`.
cg-netstack = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
