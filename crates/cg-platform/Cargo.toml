[package]
name = "cg-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cg-core.workspace = true
tracing.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hev-sys.workspace = true
libc.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber.workspace = true
# tests/engine_parity.rs: hev and cg-netstack under the same client and SOCKS server.
cg-netstack = { workspace = true, features = ["testkit"] }
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
cg-netstack.workspace = true
tokio.workspace = true
tokio-util.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# tests/windows_privileged.rs: FakeSocks as the relay, the real controller on FakeMux/FakePhone.
cg-netstack = { workspace = true, features = ["testkit"] }
cg-core = { workspace = true, features = ["testing"] }
cg-ipc.workspace = true
tokio.workspace = true
