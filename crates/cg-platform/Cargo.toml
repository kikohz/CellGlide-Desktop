[package]
name = "cg-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The wireless link (Windows only): access point, mDNS discovery, TLS-PSK client. Off by default.
wireless = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
cg-core.workspace = true
tracing.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hev-sys.workspace = true
libc.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber.workspace = true
# tests/engine_parity.rs: hev and cg-netstack under the same client and SOCKS server.
cg-netstack = { workspace = true, features = ["testkit"] }
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
zeroize.workspace = true
cg-netstack.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# The wireless link: TLS 1.2 with ECDHE-PSK-CHACHA20-POLY1305, which neither SChannel nor rustls
# offer; OpenSSL is built from source and linked statically. Optional (feature `wireless`), so
# binaries that do not use it do not carry it.
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
socket2.workspace = true
windows = { workspace = true, features = [
    "Devices_Enumeration",
    "Devices_WiFiDirect",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Security_Credentials",
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# tests/windows_privileged.rs: FakeSocks as the relay, the real controller on FakeMux/FakePhone.
cg-netstack = { workspace = true, features = ["testkit"] }
cg-core = { workspace = true, features = ["testing"] }
cg-ipc.workspace = true
tokio.workspace = true
# examples/wireless_gate.rs: the hello request, local timestamps, the library's log lines.
cg-protocol.workspace = true
jiff.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "wireless_gate"
required-features = ["wireless"]
