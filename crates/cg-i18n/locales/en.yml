  bad_day: "Only the last 7 days can be viewed (date format YYYY-MM-DD)"
check:
  fix: "Fix: %{fix}"
  service:
    ok: "The CellGlide service is running"
    fail: "The CellGlide service isn't running (%{error})"
    fail_windows: "Can't reach the CellGlide service (%{error})"
    impostor: "another program has taken its control pipe"
    fix: "sudo systemctl enable --now cellglide"
    fix_windows: "in PowerShell run as administrator: Start-Service CellGlide"
    fix_not_allowed: "use the account that is signed in at this computer, or ask an administrator"
    fix_impostor: "another program is using CellGlide's control channel; restart the computer or reinstall CellGlide"
  group:
    ok: "The current user can control CellGlide"
    fail: "The current user isn't in the cellglide group and can't control the service"
    fix: "sudo usermod -aG cellglide $USER, then log out and back in"
  usbmuxd:
    ok: "The USB service is running"
    idle: "The USB service is installed and starts when an iPhone is plugged in"
    fail: "The USB service usbmuxd isn't installed"
    fix: "Ubuntu / Debian: sudo apt install usbmuxd; Fedora: sudo dnf install usbmuxd"
    ok_windows: "Apple's device service is answering on port 27015"
    idle_windows: "Apple's device service is installed and runs after you sign in to Windows (port 27015 isn't answering yet)"
    fail_windows: "Apple's device service isn't answering on port 27015 (the Apple Devices app isn't installed or hasn't started)"
    fix_windows: "install and open the Apple Devices app: winget install --id 9NP83LWLPZ9K --source msstore, or open ms-windows-store://pdp/?ProductId=9NP83LWLPZ9K; it then runs whenever you sign in to Windows"
  phone:
    ok: "%{count} iPhone(s) detected"
    fail: "No iPhone is plugged in"
    fix: "Connect the iPhone with a cable and unlock it"
  trust:
    ok: "The iPhone trusts this computer"
    fail: "The iPhone doesn't trust this computer yet: %{serials}"
    fix: "Unlock the iPhone and tap Trust; if no prompt appears, unplug and plug the cable back in"
    fix_windows: "Unlock the iPhone and tap Trust; if no prompt appears, open the Apple Devices app and plug the cable back in"
  resolved:
    ok: "systemd-resolved is running"
    fail: "CellGlide needs systemd-resolved to set DNS on its own interface only"
    fix: "Ubuntu / Debian: sudo apt install systemd-resolved, then sudo systemctl enable --now systemd-resolved; Fedora: sudo systemctl enable --now systemd-resolved"
  polkit:
    ok: "polkit is installed"
    fail: "polkit isn't installed, so systemd-resolved won't let CellGlide set DNS"
    fix: "Ubuntu 22.04: sudo apt install policykit-1; newer Ubuntu / Debian: sudo apt install polkitd; Fedora: sudo dnf install polkit"
  polkit_rule:
    ok: "CellGlide's polkit rule is installed"
    fail: "CellGlide's polkit rule is missing, so systemd-resolved won't let CellGlide set DNS"
    fix: "reinstall CellGlide: sudo apt install --reinstall cellglide (Fedora: sudo dnf reinstall cellglide)"
  tun:
    ok: "The kernel supports TUN interfaces"
    fail: "The kernel's TUN interface support (/dev/net/tun) is missing"
    fix: "sudo modprobe tun"
  apple_service:
    ok: "Apple's device service is installed (%{kind})"
    kind_store: "Apple Devices app"
    kind_itunes: "iTunes / Apple Mobile Device Support"
    fail: "Apple's device service isn't installed or isn't running"
    fix: "install and open the Apple Devices app: winget install --id 9NP83LWLPZ9K --source msstore, or open ms-windows-store://pdp/?ProductId=9NP83LWLPZ9K; it then runs whenever you sign in to Windows"
  wintun:
    ok: "wintun.dll is present and properly signed"
    fail: "wintun.dll is missing or its signature isn't valid"
    fix: "run the installation command again in PowerShell: irm https://pkg.cellglide.com/install.ps1 | iex"
  dns:
    ok: "CellGlide's DNS port 53 is free"
    fail: "Another program is using DNS port 53: %{owner}"
    fix: "turn off that program's DNS feature, such as Internet Connection Sharing (the SharedAccess service)"
    unknown: "Couldn't check whether another program is using DNS port 53 (%{error})"
    fix_unreadable: "run the check again; if it still can't check, restart the computer"
    owner_pid: "process %{pid}"
