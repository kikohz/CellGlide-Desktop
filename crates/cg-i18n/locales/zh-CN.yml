    ok: "USB 服务正在运行"
    idle: "USB 服务已安装，插上 iPhone 时会自动启动"
    fail: "没有安装 USB 服务 usbmuxd"
    fix: "Ubuntu / Debian：sudo apt install usbmuxd；Fedora：sudo dnf install usbmuxd"
    ok_windows: "Apple 设备服务正在端口 27015 上响应"
    idle_windows: "Apple 设备服务已安装，登录 Windows 后会自动运行（端口 27015 暂时没有响应）"
    fail_windows: "Apple 设备服务没有在端口 27015 上响应（「Apple 设备」应用没有安装或还没有启动）"
    fix_windows: "安装并打开「Apple 设备」应用：winget install --id 9NP83LWLPZ9K --source msstore，或打开 ms-windows-store://pdp/?ProductId=9NP83LWLPZ9K；之后每次登录 Windows 它都会自动运行"
  phone:
    ok: "已检测到 %{count} 部 iPhone"
    fail: "没有检测到插着的 iPhone"
    fix: "用数据线连接 iPhone 并解锁屏幕"
  trust:
    ok: "iPhone 已信任这台电脑"
    fail: "iPhone 还没有信任这台电脑：%{serials}"
    fix: "解锁 iPhone，在弹窗中点「信任」；没有弹窗时重新插拔数据线"
    fix_windows: "解锁 iPhone，在弹窗中点「信任」；没有弹窗时打开「Apple 设备」应用，再重新插拔数据线"
  resolved:
    ok: "systemd-resolved 正在运行"
    fail: "CellGlide 需要 systemd-resolved 来只给自己的网卡设置 DNS"
    fix: "Ubuntu / Debian：sudo apt install systemd-resolved，然后 sudo systemctl enable --now systemd-resolved；Fedora：sudo systemctl enable --now systemd-resolved"
  polkit:
    ok: "polkit 已安装"
    fail: "没有安装 polkit，systemd-resolved 不会让 CellGlide 设置 DNS"
    fix: "Ubuntu 22.04：sudo apt install policykit-1；较新的 Ubuntu / Debian：sudo apt install polkitd；Fedora：sudo dnf install polkit"
  polkit_rule:
    ok: "CellGlide 的 polkit 规则已安装"
    fail: "缺少 CellGlide 的 polkit 规则，systemd-resolved 不会让 CellGlide 设置 DNS"
    fix: "重新安装 CellGlide：sudo apt install --reinstall cellglide（Fedora：sudo dnf reinstall cellglide）"
  tun:
    ok: "内核支持 TUN 虚拟网卡"
    fail: "缺少内核的 TUN 虚拟网卡支持（/dev/net/tun）"
    fix: "sudo modprobe tun"
  apple_service:
    ok: "Apple 设备服务已安装（%{kind}）"
    kind_store: "「Apple 设备」应用"
    kind_itunes: "iTunes / Apple Mobile Device Support"
    fail: "Apple 设备服务没有安装或没有运行"
    fix: "安装并打开「Apple 设备」应用：winget install --id 9NP83LWLPZ9K --source msstore，或打开 ms-windows-store://pdp/?ProductId=9NP83LWLPZ9K；之后每次登录 Windows 它都会自动运行"
  wintun:
    ok: "wintun.dll 存在且签名有效"
    fail: "wintun.dll 缺失或签名无效"
    fix: "在 PowerShell 中重新运行安装命令：irm https://pkg.cellglide.com/install.ps1 | iex"
  dns:
    ok: "CellGlide 的 DNS 端口 53 没有被占用"
    fail: "DNS 端口 53 被其他程序占用：%{owner}"
    fix: "停用该程序的 DNS 功能，例如「Internet 连接共享」（SharedAccess 服务）"
