name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # By file path: scripts/tests has no __init__.py, so discovery does not find it.
      - run: python3 -m unittest scripts/tests/test_release_linux_json.py

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  resolved-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/*.sh && sudo scripts/probe-resolved.sh

  privileged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cg-platform --examples --tests --locked
      - run: sudo -E env "PATH=$PATH" cargo test -p cg-platform --test privileged --locked -- --ignored --test-threads=1
