name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # By file path: scripts/tests has no __init__.py, so discovery does not find it.
      - run: python3 -m unittest scripts/tests/test_release_linux_json.py
      - run: python3 -m unittest scripts/tests/test_release_windows_json.py

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pester 5.5 to 5.x (Windows PowerShell may carry 3.4)
        shell: powershell
        run: |
          $ok = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0.0' }
          if (-not $ok) {
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Get-Module -ListAvailable Pester | Select-Object Version, ModuleBase
      - name: cargo-about 0.9.2 (cache)
        id: about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-0.9.2-${{ runner.arch }}
      - name: cargo-about 0.9.2 (install)
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest scripts/tests/test_release_windows_json.py
      - name: network-snapshot script tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\tests\test-network-snapshot.ps1
      - name: Privileged wintun test (hosted runners are administrators)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # dockerd on the runner image listens on 172.x.x.1:53, which blocks the resolver-port test's
          # exclusive hold of 0.0.0.0:53. Stop it so that test runs for real (the arm64 image has none).
          Stop-Service docker -ErrorAction SilentlyContinue
          $before = "$env:RUNNER_TEMP\net-before.json"
          $after = "$env:RUNNER_TEMP\net-after.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Out $before
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-wintun.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:CELLGLIDE_WINTUN_DLL = (Resolve-Path target\debug\wintun.dll).Path
          cargo test -p cg-platform --test windows_privileged --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Out $after
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Compare $before $after
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Core checks and app publish
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-windows-core.ps1 -Publish
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package and install round trip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Arch x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ver = (Get-ChildItem dist\windows -Directory | Select-Object -First 1).Name
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\install-roundtrip.ps1 -Zip "dist\windows\$ver\CellGlide-$ver-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-arm64
      - name: LLVM (clang) for the ARM64 C build
        shell: powershell
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) {
            choco install llvm -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          & "$llvm\clang.exe" --version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pester 5.5 to 5.x (Windows PowerShell may carry 3.4)
        shell: powershell
        run: |
          $ok = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0.0' }
          if (-not $ok) {
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Get-Module -ListAvailable Pester | Select-Object Version, ModuleBase
      - name: cargo-about 0.9.2 (cache)
        id: about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-0.9.2-${{ runner.arch }}
      - name: cargo-about 0.9.2 (install)
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest scripts/tests/test_release_windows_json.py
      - name: network-snapshot script tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\tests\test-network-snapshot.ps1
      - name: Privileged wintun test (hosted runners are administrators)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner image's dockerd listens on 172.x.x.1:53, which the resolver-port test (an exclusive
          # bind of 0.0.0.0:53) cannot coexist with. Stop it before the first snapshot.
          Stop-Service docker -ErrorAction SilentlyContinue
          # Internet Connection Sharing (SharedAccess) holds 0.0.0.0:53 on the arm64 image.
          Stop-Service SharedAccess -Force -ErrorAction Continue
          (Get-Service SharedAccess, docker -ErrorAction SilentlyContinue | Format-Table Name, Status | Out-String).Trim()
          Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue | ForEach-Object { "UDP 53 still held: $($_.LocalAddress) pid $($_.OwningProcess)" }
          $before = "$env:RUNNER_TEMP\net-before.json"
          $after = "$env:RUNNER_TEMP\net-after.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Out $before
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-wintun.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:CELLGLIDE_WINTUN_DLL = (Resolve-Path target\debug\wintun.dll).Path
          cargo test -p cg-platform --test windows_privileged --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Out $after
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\network-snapshot.ps1 -Compare $before $after
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Core checks and app publish
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-windows-core.ps1 -Publish
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package and install round trip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Arch arm64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ver = (Get-ChildItem dist\windows -Directory | Select-Object -First 1).Name
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\tests\install-roundtrip.ps1 -Zip "dist\windows\$ver\CellGlide-$ver-windows-arm64.zip"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  windows-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/windows-')
    needs: [windows-x64, windows-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - name: LLVM (clang) for the ARM64 C build
        if: matrix.arch == 'arm64'
        shell: powershell
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) {
            choco install llvm -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          & "$llvm\clang.exe" --version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: CellGlide-windows-${{ matrix.arch }}
          path: |
            dist/windows/*/CellGlide-*-windows-${{ matrix.arch }}.zip
            dist/windows/*/SHA256SUMS.${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: CellGlide-windows-${{ matrix.arch }}-symbols
          path: dist/windows/*/CellGlide-*-windows-${{ matrix.arch }}-symbols.zip
          if-no-files-found: error
          retention-days: 90

  resolved-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/*.sh && sudo scripts/probe-resolved.sh

  privileged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cg-platform --examples --tests --locked
      - run: sudo -E env "PATH=$PATH" cargo test -p cg-platform --test privileged --locked -- --ignored --test-threads=1
