name: diag
on: push
jobs:
  d:
    runs-on: windows-11-arm
    steps:
      - shell: powershell
        run: |
          $p = (Get-NetUDPEndpoint -LocalPort 53).OwningProcess
          "pid $p"; (Get-CimInstance Win32_Service | Where-Object ProcessId -eq $p | ForEach-Object Name) -join ','
          sc.exe stop SharedAccess | Out-Null
          Start-Sleep 20
          (Get-Service SharedAccess).Status
          Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue | ForEach-Object { "after 20s: $($_.LocalAddress) pid $($_.OwningProcess)" }
          taskkill /f /pid $p
          Start-Sleep 5
          (Get-Service SharedAccess).Status
          Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue | ForEach-Object { "after kill: $($_.LocalAddress) pid $($_.OwningProcess)" }
          "done"
