name: diag
on: push
jobs:
  d:
    runs-on: windows-11-arm
    steps:
      - shell: powershell
        run: |
          sc.exe config SharedAccess start= disabled
          sc.exe failure SharedAccess reset= 0 actions= '""'
          sc.exe qfailure SharedAccess
          sc.exe stop SharedAccess | Out-Null
          for ($i = 0; $i -lt 12; $i++) {
            $e = Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue
            "t=$($i*5)s status=$((Get-Service SharedAccess).Status) holder=$(($e | ForEach-Object { $_.LocalAddress + ' pid ' + $_.OwningProcess }) -join ';')"
            if (-not $e) { break }
            foreach ($x in $e) { taskkill /f /pid $x.OwningProcess }
            Start-Sleep 5
          }
          "done"
