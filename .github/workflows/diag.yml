name: diag
on: push
jobs:
  d:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: powershell
        run: |
          Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue | ForEach-Object { $p = Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue; "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess) $($p.ProcessName)"; Get-CimInstance Win32_Service | Where-Object ProcessId -eq $_.OwningProcess | ForEach-Object { "  service $($_.Name)" } }
          netstat -ano -p UDP | Select-String ':53 '
          Get-Service SharedAccess, Dnscache, hns, vmcompute -ErrorAction SilentlyContinue | Format-Table Name, Status
